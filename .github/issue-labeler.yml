# Issue labeling configuration
# Labels are applied based on issue title and body content

# Priority Labels
'priority/high':
  - 'critical'
  - 'urgent'
  - 'crash'
  - 'broken'
  - 'not working'

'priority/medium':
  - 'important'
  - 'should have'
  - 'improvement'

'priority/low':
  - 'nice to have'
  - 'enhancement'
  - 'minor'

