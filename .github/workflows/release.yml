name: 🚀 Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 📋 Prepare Release
  prepare:
    name: 📋 Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🏷️ Determine Version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "tag=${VERSION}" >> $GITHUB_OUTPUT
        echo "Release version: ${VERSION}"

  # 🧪 Pre-Release Tests
  test:
    name: 🧪 Pre-Release Tests
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: 🧪 Run Full Test Suite
      run: |
        pytest tests/ -v --cov=rpg_engine
        
    - name: 🎮 Integration Test
      run: |
        python -c "
        from rpg_engine.core.service_container import ServiceContainer
        from rpg_engine.ui.modular_ui_system import ModularUIManager
        print('✅ Core systems integration verified')
        "

  # 🏗️ Build Release
  build:
    name: 🏗️ Build Release Assets
    runs-on: ubuntu-latest
    needs: [prepare, test]
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine
        pip install -r requirements.txt
        
    - name: 🔨 Build Distribution
      run: |
        python -m build
        
    - name: 📦 Create Release Archive
      run: |
        # Create source archive
        tar -czf rpg-engine-${{ needs.prepare.outputs.version }}-source.tar.gz \
          --exclude='.git*' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.pytest_cache' \
          --exclude='dist' \
          --exclude='build' \
          .
          
        # Create executable bundle info
        cat > INSTALL.txt << EOF
        🎮 RPG Engine ${{ needs.prepare.outputs.version }}
        
        📋 Installation Instructions:
        1. Extract this archive
        2. Install Python 3.11+ 
        3. Run: pip install -r requirements.txt
        4. Launch: python main_enhanced.py
        
        📖 Documentation: docs/README.md
        🐛 Issues: https://github.com/cjmit18/RPG-Make/issues
        EOF
        
    - name: 📤 Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-assets
        path: |
          dist/
          rpg-engine-${{ needs.prepare.outputs.version }}-source.tar.gz
          INSTALL.txt

  # 📖 Generate Release Notes
  changelog:
    name: 📖 Generate Release Notes
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 📝 Generate Changelog
      id: notes
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
        echo "Previous tag: $PREV_TAG"
        
        # Generate changelog
        cat > release-notes.md << EOF
        ## 🎮 RPG Engine ${{ needs.prepare.outputs.version }}
        
        ### ✨ What's New
        
        $(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD | grep -E "(feat|add|new)" | head -10)
        
        ### 🐛 Bug Fixes
        
        $(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD | grep -E "(fix|bug)" | head -10)
        
        ### 🔧 Improvements
        
        $(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD | grep -E "(improve|enhance|update)" | head -10)
        
        ### 📋 Full Changelog
        
        **Commits in this release:** $(git rev-list --count ${PREV_TAG}..HEAD)
        
        [View full changelog](https://github.com/cjmit18/RPG-Make/compare/${PREV_TAG}...${{ needs.prepare.outputs.version }})
        
        ### 🚀 Installation
        
        \`\`\`bash
        # Clone the repository
        git clone https://github.com/cjmit18/RPG-Make.git
        cd RPG-Make
        
        # Install dependencies
        pip install -r requirements.txt
        
        # Launch the application
        python main_enhanced.py
        \`\`\`
        
        ### 🎯 Key Features
        
        - ✅ **Modern UI System** - Streamlined 3-tab character creation
        - ✅ **Template System** - 8 character templates with growth stats
        - ✅ **Smart Stat Distribution** - AI-powered character optimization
        - ✅ **Live Preview** - Real-time character updates
        - ✅ **Export/Import** - Save and share character builds
        
        EOF
        
        # Set output
        {
          echo 'notes<<EOF'
          cat release-notes.md
          echo EOF
        } >> $GITHUB_OUTPUT
        
    - name: 📤 Upload Release Notes
      uses: actions/upload-artifact@v3
      with:
        name: release-notes
        path: release-notes.md

  # 🚀 Create GitHub Release
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, test, build, changelog]
    
    steps:
    - name: 📥 Download Release Assets
      uses: actions/download-artifact@v3
      with:
        name: release-assets
        path: ./assets
        
    - name: 📥 Download Release Notes
      uses: actions/download-artifact@v3
      with:
        name: release-notes
        path: ./notes
        
    - name: 🚀 Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        release_name: 🎮 RPG Engine ${{ needs.prepare.outputs.version }}
        body_path: ./notes/release-notes.md
        draft: false
        prerelease: false
        
    - name: 📦 Upload Source Archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./assets/rpg-engine-${{ needs.prepare.outputs.version }}-source.tar.gz
        asset_name: rpg-engine-${{ needs.prepare.outputs.version }}-source.tar.gz
        asset_content_type: application/gzip
        
    - name: 📋 Upload Installation Guide
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./assets/INSTALL.txt
        asset_name: INSTALL.txt
        asset_content_type: text/plain

  # 📊 Post-Release
  notify:
    name: 📊 Post-Release Notifications
    runs-on: ubuntu-latest
    needs: [prepare, release]
    if: success()
    
    steps:
    - name: 🎉 Success Notification
      run: |
        echo "🎉 Successfully released RPG Engine ${{ needs.prepare.outputs.version }}"
        echo "📦 Release URL: https://github.com/cjmit18/RPG-Make/releases/tag/${{ needs.prepare.outputs.tag }}"
        echo "🔗 Download: https://github.com/cjmit18/RPG-Make/archive/${{ needs.prepare.outputs.tag }}.tar.gz"
