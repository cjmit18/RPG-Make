name: Template System Demo Tests

on:
  push:
    branches: [ main, testing_center, develop, Test3 ]
  pull_request:
    branches: [ main, testing_center, develop, Test3 ]

jobs:
  template-demo:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Test template system initialization
      run: |
        python -c "
        from rpg_engine.core.template_loader import get_template_manager
        from rpg_engine.core.config import GameConfig
        
        # Initialize systems
        tm = get_template_manager()
        config = GameConfig()
        
        print('✅ Template system initialized successfully')
        print(f'✅ Loaded {tm.get_template_stats()[\"total_templates\"]} templates')
        "
        
    - name: Run comprehensive template loading test
      run: |
        # Run the full template loading test suite
        python test_template_loading.py
        
    - name: Run character system demonstration
      run: |
        # Run the character creation and stat system demo
        python examples/demo_character_system.py
        
    - name: Test character template validation
      run: |
        python -c "
        from rpg_engine.core.template_loader import get_template_manager
        
        tm = get_template_manager()
        errors = tm.validate_all_templates()
        
        total_errors = sum(len(error_list) for error_list in errors.values())
        if total_errors > 0:
            print(f'⚠️ Found {total_errors} validation issues')
            for template_type, error_list in errors.items():
                for error in error_list:
                    print(f'  - {template_type}: {error}')
        else:
            print('✅ All templates pass validation')
        "
        
    - name: Test stat calculation examples
      run: |
        python -c "
        from rpg_engine.core.template_loader import get_template_manager
        from rpg_engine.core.config import GameConfig
        
        tm = get_template_manager()
        config = GameConfig()
        
        # Test warrior progression
        warrior = tm.get_character_template('warrior_basic')
        if warrior:
            print(f'🛡️ {warrior.name} Level 1 Strength: {warrior.calculate_stat_at_level(\"strength\", 1)}')
            print(f'🛡️ {warrior.name} Level 10 Strength: {warrior.calculate_stat_at_level(\"strength\", 10)}')
            
            # Test derived stat calculation
            raw_config = config.get_raw_config()
            formulas = raw_config.get('character_mechanics', {}).get('derived_stat_formulas', {})
            if formulas:
                constitution_10 = warrior.calculate_stat_at_level('constitution', 10)
                health = constitution_10 * formulas.get('health', 10.0)
                print(f'🛡️ {warrior.name} Level 10 Health: {health} (Constitution: {constitution_10} × {formulas.get(\"health\", 10.0)})')
                
        print('✅ Stat calculation demonstrations completed')
        "

  observer-pattern-demo:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Test observer pattern systems
      run: |
        python -c "
        import asyncio
        from rpg_engine.core.event_bus import EventBus
        from rpg_engine.core.config import GameConfig
        from rpg_engine.systems.achievements.achievement_system import AchievementSystem
        from rpg_engine.systems.notifications.notification_system import NotificationSystem
        
        async def test_observer_patterns():
            # Initialize systems
            event_bus = EventBus()
            config = GameConfig()
            
            # Initialize achievement system
            achievement_system = AchievementSystem(event_bus, config)
            await achievement_system.initialize()
            print(f'✅ Achievement system loaded')
            
            # Initialize notification system
            notification_system = NotificationSystem(event_bus)
            await notification_system.initialize()
            print(f'✅ Notification system loaded')
            
            # Test event publishing
            await event_bus.publish('character_created', {
                'character_id': 'test_hero',
                'character_class': 'warrior',
                'level': 1
            })
            print('✅ Event published successfully')
            
            # Small delay to allow async processing
            await asyncio.sleep(0.1)
            print('✅ Observer pattern demonstration completed')
        
        asyncio.run(test_observer_patterns())
        "
        
    - name: Test data-driven content loading
      run: |
        python -c "
        from rpg_engine.core.template_loader import get_template_manager
        
        tm = get_template_manager()
        
        # Show character templates
        character_templates = tm.list_character_templates()
        print(f'📋 Character Templates: {len(character_templates)}')
        for template in character_templates[:3]:  # Show first 3
            print(f'  - {template.name} ({template.character_class}) - Rarity: {template.rarity}')
        
        # Show achievement templates  
        achievement_templates = tm.list_achievement_templates()
        print(f'🏆 Achievement Templates: {len(achievement_templates)}')
        for template in achievement_templates[:3]:  # Show first 3
            print(f'  - {template.name} ({template.points} points)')
            
        print('✅ Data-driven content loading demonstration completed')
        "
            print(f'❌ Async engine demo import failed: {e}')
            import sys
            sys.exit(1)
        "
            
        # Test UI service components
        try:
            import tkinter as tk
            print('✅ GUI toolkit available')
        except Exception as e:
            print(f'⚠️ GUI not available (expected in CI): {e}')
        "
        
    - name: Validate demo configuration
      run: |
        python -c "
        from game_sys.config.config_manager import ConfigManager
        cfg = ConfigManager()
        
        # Verify critical config values
        strength_mult = cfg.get('constants.combat.strength_multiplier')
        stamina_costs = cfg.get('constants.combat.stamina_costs') 
        max_level = cfg.get('constants.leveling.max_level')
        grades = cfg.get('defaults.grades')
        rarities = cfg.get('defaults.rarities')
        
        assert strength_mult is not None, 'strength_multiplier missing'
        assert stamina_costs is not None, 'stamina_costs missing'
        assert max_level is not None, 'max_level missing'
        assert grades is not None, 'grades missing'
        assert rarities is not None, 'rarities missing'
        
        print('✅ Demo configuration validation passed')
        print(f'  - Strength Multiplier: {strength_mult}')
        print(f'  - Max Level: {max_level}')
        print(f'  - Grades Available: {len(grades)}')
        print(f'  - Rarities Available: {len(rarities)}')
        "
        
    - name: Test character creation and stats
      run: |
        python -c "
        from game_sys.character.character_factory import create_character
        
        # Test hero creation
        hero = create_character('hero')
        assert hero is not None, 'Hero creation failed'
        assert hero.name == 'Valiant Hero', 'Hero name incorrect'
        assert hasattr(hero, 'level'), 'Hero missing level'
        assert hasattr(hero, 'base_stats'), 'Hero missing base_stats'
        assert hasattr(hero, 'current_health'), 'Hero missing current_health'
        assert hasattr(hero, 'max_health'), 'Hero missing max_health'
        
        # Test enemy creation  
        enemy = create_character('goblin')
        assert enemy is not None, 'Enemy creation failed'
        assert hasattr(enemy, 'level'), 'Enemy missing level'
        
        print('✅ Character creation and stats validation passed')
        print(f'  - Hero: {hero.name} (Level {hero.level})')
        print(f'  - Hero HP: {hero.current_health}/{hero.max_health}')
        print(f'  - Hero Stats: {len(hero.base_stats)} attributes')
        if hasattr(enemy, 'name'):
            print(f'  - Enemy: {enemy.name} (Level {enemy.level})')
        "
        
    - name: Test spell and combat systems
      run: |
        python -c "
        from game_sys.magic.spell_system import SpellSystem
        from game_sys.combat.combat_service import CombatService
        from game_sys.character.character_factory import create_character
        
        # Test spell system
        spell_system = SpellSystem()
        spells = spell_system.list_spells()
        assert len(spells) > 0, 'No spells loaded'
        
        # Test combat service
        combat = CombatService()
        hero = create_character('hero')
        enemy = create_character('goblin')
        
        # Perform a basic attack test
        result = combat.perform_attack(hero, enemy)
        assert 'success' in result, 'Attack result format incorrect'
        
        print('✅ Spell and combat systems validation passed')
        print(f'  - Spells Available: {len(spells)}')
        print(f'  - Attack System: Functional')
        "
        
    - name: Run specific demo tests (if available)
      run: |
        # Look for and run demo-specific test files
        if [ -f test_spell_fix.py ]; then
          echo 'Running spell fix validation...'
          timeout 30 python test_spell_fix.py || echo 'Spell test completed (may have timed out)'
        fi
        
        if [ -f validate_integration.py ]; then
          echo 'Running integration validation...'
          python validate_integration.py || echo 'Integration validation completed'
        fi
        
        echo '✅ Demo-specific tests completed'
